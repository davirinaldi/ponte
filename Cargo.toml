[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/davirinaldi/ponte"
publish = false

[workspace.dependencies]
# Internal crates
ponte-protocol = { path = "crates/protocol" }
ponte-actions = { path = "crates/actions" }
ponte-decision = { path = "crates/decision" }
ponte-server = { path = "crates/server" }

# Shared external crates. Add new ones here, then reference them with `workspace = true`.
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
http-body-util = "0.1"
# The agent picks the crypto provider and the certificate verifier itself (ADR-0009), so
# rustls comes without its defaults: no aws-lc-rs, no TLS 1.2 (RNF-01), no logging.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# PostgreSQL only, rustls with ring, queries checked at compile time against `.sqlx/`.
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
# Only what the telemetry snapshot reads. Never `user`, `network` or `component`.
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# TLS without a built-in root store: the agent hands in its own `rustls::ClientConfig`.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["__rustls-tls"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
# Default features minus `tracing-log`: that bridge sends what dependencies write through the
# `log` crate to our output, and the WebSocket library writes every frame it reads there.
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "smallvec", "std"] }
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
# `unsafe` is denied everywhere. The only exception is the agent's platform module,
# which opts in locally with `#[allow(unsafe_code)]` and documents every block.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
# The agent runs on weak point-of-sale PCs: optimise for size and strip symbols.
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
