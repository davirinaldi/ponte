[package]
name = "ponte-agent"
description = "Ponte agent: privileged Windows service that reports telemetry and runs signed actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
ponte-actions.workspace = true
ponte-protocol.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# Windows-only dependencies stay under cfg(windows), so the crate still builds on Linux CI.
[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
axum.workspace = true
ponte-server.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["tls12"] }
tokio = { workspace = true, features = ["io-util", "test-util"] }

# Tests only: a named pipe that tries to impersonate whoever opens it.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes"] }

[lints]
workspace = true

