# Copy to agent.toml for local development: cargo run -p ponte-agent -- run agent.toml
# from an ordinary console. Elevated, and as the Windows service (`ponte-agent service
# --config <path>`), the agent applies the rules of ADR-0011 and ADR-0013: this file, the
# data directory, the token and the agent's own executable must be owned by SYSTEM or
# Administrators and changeable by nobody else, every path must be absolute, and ws:// is
# refused. A refusal before the log goes to the Event Log, source PonteAgent.
server_url = "ws://127.0.0.1:8080/agent"

# Where path checks may look. Each is also resolved when the agent starts, through any
# junction, and must pass the same rules where it ends up; one that does not exist yet is
# left out until the agent starts again.
allowed_roots = ['C:\FakeErp']

# Where the device key (under DPAPI on Windows), the identity, the journal of actions, the
# clock mark and the service's logs live. The installer writes an absolute path that only
# administrators can change, outside every root; the agent makes it, with an ACL for SYSTEM
# and Administrators only, if it is missing. `keys/` is ignored by git.
data_dir = "keys/agent-dev"

# The enrollment token: 64 lowercase hex characters. Read once, removed once enrolled.
enrollment_token_file = "keys/agent-dev/enrollment-token"

# Seconds between heartbeats (10 to 3600).
heartbeat_secs = 60

# Actions (ADR-0010, ADR-0011). Without manifest_keys the agent runs no action at all.
# Up to four ed25519 public keys in lowercase hex, as `ponte-sign keygen` prints them;
# two let one be retired. An empty list is refused.
# manifest_keys = ["<64 lowercase hex characters>"]

# The highest risk this machine runs: "read", "low" or "medium". "high" is refused.
max_risk = "medium"

# Every service a manifest names, in a step or a check, must be here (up to 32, ASCII).
# Windows' own services and the agent's are refused whatever this list says.
allowed_services = ["FakeErp"]

# Where delete_file may act, each inside an allowed root.
delete_roots = ['C:\FakeErp\run']

# Requests started in the last hour (1 to 60), and seconds between two runs of the same
# manifest (60 to 86400).
max_actions_per_hour = 20
min_manifest_interval_secs = 600

# How long a stop waits for the running action, in seconds (1 to 60). What does not end
# in time is recorded as interrupted and never runs again.
shutdown_timeout_secs = 10
