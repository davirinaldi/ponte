# cargo-deny: licenses, advisories, bans and sources. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS goes through rustls. See AGENTS.md.
  { name = "openssl" },
  { name = "openssl-sys" },
  # Sends what dependencies write through the `log` crate to our output. The WebSocket
  # library writes every frame there, enrollment tokens included. See the root Cargo.toml.
  { name = "tracing-log" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
