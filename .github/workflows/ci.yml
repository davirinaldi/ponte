name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The query macros check against crates/server/.sqlx, never a live database.
  SQLX_OFFLINE: "true"

jobs:
  linux:
    name: Lint and test (ubuntu-latest, with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ponte
          POSTGRES_PASSWORD: ponte
          POSTGRES_DB: ponte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; rustup installs them on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The tests that need a database, on what the step above already built.
      - run: cargo test -p ponte-server -- --ignored pg_
        env:
          DATABASE_URL: postgres://ponte:ponte@localhost:5432/ponte
      # .sqlx/ was made from the schema the migrations build: check every query against it.
      - name: Queries match the migrated schema
        run: |
          cargo run -q -p ponte-server -- migrate
          touch crates/server/src/agents/pg.rs
          SQLX_OFFLINE=false cargo check -p ponte-server --all-targets
        env:
          DATABASE_URL: postgres://ponte:ponte@localhost:5432/ponte
      # The agent built on its own: TLS 1.3 only (RNF-01) and no test-only crate. A build
      # that includes the server unifies features, and sqlx brings rustls's tls12 with it.
      # Every target, so that Windows-only dependencies count too; `shell: bash` adds
      # pipefail, so a failing `cargo tree` fails the step.
      - name: The agent's release has no TLS 1.2 and no test crates
        shell: bash
        run: |
          rustls=$(cargo tree -p ponte-agent -e normal --target all -i rustls --depth 0 -f '{p} {f}')
          echo "$rustls"
          if grep -q tls12 <<<"$rustls"; then echo "the agent's rustls has tls12"; exit 1; fi
          build=$(cargo tree -p ponte-agent -e normal,build --target all -f '{p}')
          if grep -q 'rcgen v' <<<"$build"; then echo "rcgen is in the agent's build"; exit 1; fi

  windows:
    name: Lint and test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cargo-deny:
    name: Dependencies (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
