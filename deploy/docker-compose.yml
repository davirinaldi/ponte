# Local development services. Start with: docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ponte
      POSTGRES_PASSWORD: ponte
      POSTGRES_DB: ponte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponte"]
      interval: 5s
      retries: 10

  # Added in later milestones:
  # zammad   - helpdesk for the end-to-end demo (M4)
  # coturn   - TURN relay for WebRTC (phase 2)
  # minio    - S3-compatible storage for recordings (phase 3)

volumes:
  pgdata:
